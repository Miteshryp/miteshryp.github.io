{{- /* Footer custom content area start */ -}}
<div class="search-modal-overlay" id="search-modal-overlay" aria-hidden="true">
    <div class="search-modal" role="dialog" aria-modal="true" aria-label="Search">
        <div class="search-modal-header">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="search" class="search-modal-input" id="search-modal-input"
                placeholder="Search posts…" autocomplete="off" aria-label="Search">
            <button class="search-modal-close" id="search-modal-close" aria-label="Close search">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="search-modal-body" id="search-modal-results">
            <div class="search-modal-empty">Start typing to search posts…</div>
        </div>
    </div>
</div>
<script>
(() => {
    const overlay = document.getElementById('search-modal-overlay');
    const input = document.getElementById('search-modal-input');
    const results = document.getElementById('search-modal-results');
    const toggle = document.getElementById('search-toggle');
    const close = document.getElementById('search-modal-close');

    let fuse = null;
    let idx = null;

    const open = () => {
        overlay.classList.add('open');
        overlay.setAttribute('aria-hidden', 'false');
        document.body.classList.add('search-modal-open');
        setTimeout(() => input.focus(), 100);
        if (!idx) loadIndex();
    };

    const shut = () => {
        overlay.classList.remove('open');
        overlay.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('search-modal-open');
        input.value = '';
        renderResults([], '');
    };

    const loadIndex = async () => {
        try {
            const r = await fetch('/index.json');
            if (!r.ok) throw new Error('Index load failed');
            const data = await r.json();
            // Drop any duplicate entries (defensive: a build should not emit any).
            const seen = new Set();
            idx = (Array.isArray(data) ? data : []).filter((item) => {
                const url = item && item.permalink;
                if (!url || seen.has(url)) return false;
                seen.add(url);
                return true;
            });
            if (idx.length && typeof Fuse !== 'undefined') {
                fuse = new Fuse(idx, {
                    keys: ['title', 'content', 'summary'],
                    threshold: 0.4,
                    distance: 100,
                    ignoreLocation: true
                });
            }
        } catch (e) { console.error(e); }
    };

    const renderResults = (items, query) => {
        if (!query) {
            results.innerHTML = '<div class="search-modal-empty">Start typing to search posts…</div>';
            return;
        }
        if (!items.length) {
            results.innerHTML = '<div class="search-modal-empty">No results found for "' + escapeHtml(query) + '"</div>';
            return;
        }
        results.innerHTML = items.map(item => `
            <a href="${item.item.permalink}" class="search-modal-result">
                <div class="search-modal-result-title">${escapeHtml(item.item.title)}</div>
                <div class="search-modal-result-summary">${escapeHtml(item.item.summary || '')}</div>
            </a>
        `).join('');
    };

    const escapeHtml = (str) => {
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
    };

    const performSearch = () => {
        const q = input.value.trim();
        if (!fuse) {
            results.innerHTML = '<div class="search-modal-empty">Loading search index…</div>';
            return;
        }
        const found = q ? fuse.search(q) : [];
        renderResults(found, q);
    };

    input.addEventListener('input', performSearch);

    toggle.addEventListener('click', open);

    close.addEventListener('click', shut);

    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) shut();
    });

    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            overlay.classList.contains('open') ? shut() : open();
        }
        if (e.key === 'Escape' && overlay.classList.contains('open')) {
            shut();
        }
    });
})();
</script>
<script>
(() => {
    const overlay = document.getElementById('mobile-menu-overlay');
    const drawer = document.getElementById('mobile-menu');
    const toggleBtn = document.getElementById('menu-toggle');
    const closeBtn = document.getElementById('mobile-menu-close');
    if (!overlay || !drawer || !toggleBtn) return;

    const isOpen = () => drawer.classList.contains('open');

    const setOpen = (open) => {
        overlay.classList.toggle('open', open);
        drawer.classList.toggle('open', open);
        overlay.setAttribute('aria-hidden', String(!open));
        toggleBtn.setAttribute('aria-expanded', String(open));
        toggleBtn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        document.body.style.overflow = open ? 'hidden' : '';
    };

    toggleBtn.addEventListener('click', () => setOpen(!isOpen()));

    if (closeBtn) closeBtn.addEventListener('click', () => setOpen(false));
    overlay.addEventListener('click', () => setOpen(false));

    drawer.querySelectorAll('a').forEach((a) => {
        a.addEventListener('click', () => setOpen(false));
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isOpen()) setOpen(false);
    });

    const mq = window.matchMedia('(min-width: 768px)');
    const resetOnDesktop = (e) => {
        if (e.matches) setOpen(false);
    };
    if (mq.addEventListener) {
        mq.addEventListener('change', resetOnDesktop);
    } else if (mq.addListener) {
        mq.addListener(resetOnDesktop);
    }
})();
</script>
<script>
(() => {
    document.addEventListener('click', (e) => {
        const btn = e.target.closest('.code-block-copy');
        if (!btn) return;
        const block = btn.closest('.code-block');
        const code = block && block.querySelector('.code-block-body code');
        if (!code) return;

        const done = () => {
            const label = btn.dataset.label || btn.textContent;
            btn.dataset.label = label;
            btn.textContent = 'Copied!';
            btn.classList.add('copied');
            window.setTimeout(() => {
                btn.textContent = label;
                btn.classList.remove('copied');
            }, 1500);
        };

        const text = code.textContent;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done).catch(() => {});
        } else {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.position = 'absolute';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); done(); } catch (_) {}
            document.body.removeChild(ta);
        }
    });
})();
</script>
{{- /* Footer custom content area end */ -}}
